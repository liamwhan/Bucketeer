[package]
name = "bucketeer"
version = "2.0.0"
description = "Free open source multi-account Amazon S3 desktop browser"
authors = ["Liam Whan"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11"] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["gtk3"] }  # gtk3 is the Linux file-dialog backend; rfd refuses to build without one
tauri-plugin-opener = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "sync", "time"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client"] }
base64 = "0.22"
sha2 = "0.10"
percent-encoding = "2"
uuid = { version = "1", default-features = false, features = ["v4"] }

# Size-optimised release build.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
