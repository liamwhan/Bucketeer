name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          # Oldest supported runner keeps the AppImage compatible with older glibc.
          - os: ubuntu-22.04
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Verify package version matches tag
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          CARGO_VER=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d '"' -f2)
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::package.json version is $PKG_VER but tag is $GITHUB_REF_NAME (expected v$PKG_VER)"
            exit 1
          fi
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "::error::src-tauri/Cargo.toml version is $CARGO_VER but tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - run: npm ci

      - name: Build and package
        run: npx tauri build --bundles ${{ matrix.bundles }}
        env:
          # linuxdeploy's bundled strip can't read newer ELF sections on some runners.
          NO_STRIP: 'true'

      - name: Collect installers for artifact
        shell: bash
        run: |
          mkdir -p upload
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/nsis/*.exe                    src-tauri/target/release/bundle/dmg/*.dmg                    src-tauri/target/release/bundle/appimage/*.AppImage; do
            if [ -f "$f" ]; then cp "$f" upload/; fi
          done
          ls -la upload/
          test "$(find upload -type f | wc -l)" -ge 1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.bundles }}
          path: upload/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: dist-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Installers for **${{ github.ref_name }}**.

            - **Windows:** run the NSIS `.exe` installer.
            - **macOS:** open the `.dmg` and drag the app to Applications. Unsigned builds may require right-click → Open the first time.
            - **Linux:** `chmod +x` the `.AppImage` if needed, then run it.
          files: release-assets/*
